<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#glow)"/>
  <!-- Inner light burst (star / nova shape) -->
  <g transform="translate(60,58)" fill="#fff" opacity="0.95" filter="url(#soft-glow)">
    <!-- Vertical beam -->
    <ellipse cx="0" cy="0" rx="4" ry="26"/>
    <!-- Horizontal beam -->
    <ellipse cx="0" cy="0" rx="26" ry="4"/>
    <!-- Diagonal beams -->
    <ellipse cx="0" cy="0" rx="3.5" ry="20" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="3.5" ry="20" transform="rotate(-45)"/>
    <!-- Centre flare -->
    <circle cx="0" cy="0" r="8" fill="#fff"/>
  </g>
  <!-- "N" letter at centre -->
  <text x="60" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif"
        font-size="28" font-weight="700" fill="url(#glow)" opacity="0.9">N</text>
</svg>
