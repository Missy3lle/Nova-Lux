<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Nova Lux">
  <defs>
    <linearGradient id="caramel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7B26B"/>
      <stop offset="0.55" stop-color="#C8843E"/>
      <stop offset="1" stop-color="#9A4A26"/>
    </linearGradient>
    <!-- Lamination: thin uneven cuts through the letter, like layers of dough -->
    <mask id="layers" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <rect x="0" y="43.5" width="120" height="1.6" fill="#000"/>
      <rect x="0" y="52"   width="120" height="1.2" fill="#000"/>
      <rect x="0" y="60.5" width="120" height="1.8" fill="#000"/>
      <rect x="0" y="69"   width="120" height="1.2" fill="#000"/>
      <rect x="0" y="77"   width="120" height="1.6" fill="#000"/>
    </mask>
  </defs>
  <circle cx="60" cy="60" r="58" fill="#2B1A12"/>
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="#C8843E" stroke-opacity="0.55" stroke-width="1"/>
  <g mask="url(#layers)">
    <path d="M39 89 V31 L81 89 V31" fill="none" stroke="url(#caramel)" stroke-width="10.5"
          stroke-linejoin="miter" stroke-miterlimit="6"/>
  </g>
</svg>
